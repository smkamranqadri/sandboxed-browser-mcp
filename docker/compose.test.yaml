# Test-only override: a fixture web server the browser can reach by three fictional host
# names on the project's own network (allowed.fixture.test, blocked.fixture.test, and
# allowed.othersite.test, another site, so that its frames run out of process). It
# is a container because a server on the host is not reachable from containers behind
# a host firewall such as ufw's default. Its port is published on 127.0.0.1 only, for
# the tests to read what it received.
services:
  fixture:
    image: node:26.12.1-bookworm-slim@sha256:88e480776c6149ff1d098cd304f44bf18057fb5d284a3329b78162d29821e28c
    command: ["node", "/fixture/fixture-server.mjs"]
    volumes: ["../test/integration/fixture-server.mjs:/fixture/fixture-server.mjs:ro"]
    ports: ["127.0.0.1:${FIXTURE_PORT:-3299}:80"]
    networks:
      default:
        aliases: [allowed.fixture.test, blocked.fixture.test, allowed.othersite.test]
    restart: "no"
