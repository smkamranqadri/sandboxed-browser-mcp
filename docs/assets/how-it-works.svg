<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
  <title id="t">How sandboxed-browser-mcp works</title>
  <desc id="d">Ask: your agent calls a tool, calls run one at a time, Chromium in Docker does it, and the answer is short text. Fence: with an allowlist, the browser's own policy, a guard on page requests and a check of where each action ended keep the browser on your sites. Wrap: page text comes back marked as untrusted, with a warning when it looks like an injection, and your signed-in sessions stay in the container's profile.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrowhead"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #f6f8fa; }
    .band { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .card { fill: #ffffff; stroke: #8c959f; stroke-width: 1.4; }
    .hot { fill: #fbefff; stroke: #8250df; stroke-width: 1.6; }
    .label { fill: #8250df; font: 700 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 1px; }
    .note { fill: #59636e; font: 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .head { fill: #1f2328; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .body { fill: #59636e; font: 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { fill: #1f2328; font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .line { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .arrowhead { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .band { fill: #161b22; stroke: #30363d; }
      .card { fill: #161b22; stroke: #6e7681; }
      .hot { fill: #2b1d4e; stroke: #a371f7; }
      .label { fill: #a371f7; }
      .head, .mono { fill: #e6edf3; }
      .note, .body { fill: #9198a1; }
      .line { stroke: #6e7681; }
      .arrowhead { fill: #6e7681; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="580" rx="18"/>

  <!-- ASK -->
  <rect class="band" x="20" y="20" width="920" height="168" rx="14"/>
  <text class="label" x="40" y="48">ASK</text>
  <text class="note" x="86" y="48">every call, from any MCP client</text>

  <rect class="card" x="40" y="64" width="196" height="104" rx="10"/>
  <text class="head" x="56" y="90">Your agent calls a tool</text>
  <text class="mono" x="56" y="114">browser_navigate</text>
  <text class="mono" x="56" y="132">browser_click e12</text>
  <text class="body" x="56" y="152">eleven tools in all</text>

  <rect class="card" x="268" y="64" width="196" height="104" rx="10"/>
  <text class="head" x="284" y="90">One at a time</text>
  <text class="body" x="284" y="112">calls run in order; one that</text>
  <text class="body" x="284" y="130">hangs is answered at its time</text>
  <text class="body" x="284" y="148">limit and goes no further</text>

  <rect class="card" x="496" y="64" width="196" height="104" rx="10"/>
  <text class="head" x="512" y="90">Chromium does it</text>
  <text class="body" x="512" y="112">in a Docker container,</text>
  <text class="body" x="512" y="130">driven over CDP, local only;</text>
  <text class="body" x="512" y="148">you can watch it live</text>

  <rect class="hot" x="724" y="64" width="196" height="104" rx="10"/>
  <text class="head" x="740" y="90">A short text answer</text>
  <text class="body" x="740" y="112">the page as text with refs;</text>
  <text class="body" x="740" y="130">an action answers with what</text>
  <text class="body" x="740" y="148">changed on screen</text>

  <path class="line" d="M236 116 L 266 116" marker-end="url(#arrow)"/>
  <path class="line" d="M464 116 L 494 116" marker-end="url(#arrow)"/>
  <path class="line" d="M692 116 L 722 116" marker-end="url(#arrow)"/>

  <!-- FENCE -->
  <rect class="band" x="20" y="204" width="920" height="186" rx="14"/>
  <text class="label" x="40" y="232">FENCE</text>
  <text class="note" x="104" y="232">when you set allowed hosts: three layers, each on its own</text>

  <rect class="card" x="40" y="248" width="280" height="104" rx="10"/>
  <text class="head" x="56" y="274">The browser's own policy</text>
  <text class="body" x="56" y="296">Chromium refuses other hosts itself,</text>
  <text class="body" x="56" y="314">even while no agent is connected</text>
  <text class="body" x="56" y="332">and for what you do by hand</text>

  <rect class="card" x="340" y="248" width="280" height="104" rx="10"/>
  <text class="head" x="356" y="274">A guard on page requests</text>
  <text class="body" x="356" y="296">fails a page, frame or popup request</text>
  <text class="body" x="356" y="314">to another host, every redirect hop,</text>
  <text class="body" x="356" y="332">in every tab, before it is sent</text>

  <rect class="hot" x="640" y="248" width="280" height="104" rx="10"/>
  <text class="head" x="656" y="274">Where did it end up?</text>
  <text class="body" x="656" y="296">after each action the tab is judged;</text>
  <text class="body" x="656" y="314">off the list, the tool says "blocked"</text>
  <text class="body" x="656" y="332">and puts the tab back</text>

  <text class="note" x="40" y="376">Not covered: an allowed page's own images, scripts and XHR, which may talk to any host.</text>

  <!-- WRAP -->
  <rect class="band" x="20" y="406" width="920" height="154" rx="14"/>
  <text class="label" x="40" y="434">WRAP</text>
  <text class="note" x="100" y="434">what comes back, and what stays</text>

  <rect class="hot" x="40" y="450" width="280" height="90" rx="10"/>
  <text class="head" x="56" y="476">Marked as untrusted</text>
  <text class="mono" x="56" y="498">&lt;untrusted-web-content&gt;</text>
  <text class="body" x="56" y="520">around all page text; data, not orders</text>

  <rect class="card" x="340" y="450" width="280" height="90" rx="10"/>
  <text class="head" x="356" y="476">Injection warnings</text>
  <text class="body" x="356" y="498">a WARNING line first when the text</text>
  <text class="body" x="356" y="516">looks like an attempt to steer the agent</text>

  <rect class="card" x="640" y="450" width="280" height="90" rx="10"/>
  <text class="head" x="656" y="476">Your sessions stay put</text>
  <text class="body" x="656" y="498">sign in once by hand; cookies live in</text>
  <text class="body" x="656" y="516">the container's profile, not the agent</text>
</svg>
